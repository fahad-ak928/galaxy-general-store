<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy General Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#000428,#004e92);
}

.container{
    width:350px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:25px;
    text-align:center;
    color:#fff;
    box-shadow:0 0 20px rgba(255,215,0,.5);
}

.logo{
    width:180px;
    height:180px;
    border-radius:50%;
    border:5px solid gold;
    box-shadow:0 0 20px gold;
    transition:.5s;
}

.logo:hover{
    transform:scale(1.05) rotate(5deg);
}

h1{
    margin-top:20px;
    color:#FFD700;
    font-size:35px;
}

p{
    margin:15px 0;
    line-height:28px;
    font-size:16px;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 28px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(45deg,#fd1d1d,#833ab4,#fcb045);
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    transition:.4s;
}

.btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px #ff00aa;
}

.footer{
    margin-top:20px;
    font-size:14px;
    color:#ddd;
}
</style>
</head>

<body>

<div class="container">

<img src="galaxy.jpg" alt="Galaxy General Store" class="logo">

<h1>Galaxy General Store</h1>

<p>
📚 Stationery<br>
🖊 Pens & Notebooks<br>
🎁 Gift Items<br>
🧸 Toys<br>
⌚ Watches & More
</p>

<a class="btn" href="https://www.instagram.com/galaxygenralstore0/" target="_blank">
📷 Follow @galaxygenralstore0
</a>

<div class="footer">
✨ Thank You For Visiting ✨
</div>

</div>

</body>
</html>
